name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Rust: the Postgres extension workspace (tierdb-core + the pgrx crate).
  # fmt + clippy + the pure-crate tests, then the pgrx integration suite.
  rust-extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Postgres 17 dev headers (PGDG)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17
          sudo locale-gen en_US.UTF-8

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extension

      - name: Install cargo-pgrx
        run: cargo install cargo-pgrx --version 0.16.1 --locked

      - name: Initialize pgrx
        run: cargo pgrx init --pg17 /usr/lib/postgresql/17/bin/pg_config

      - name: Grant write access to the Postgres extension dirs
        run: |
          PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config
          sudo chown -R "$(id -u):$(id -g)" \
            "$("$PG_CONFIG" --sharedir)/extension" \
            "$("$PG_CONFIG" --pkglibdir)"

      - name: rustfmt + clippy
        run: make check-extension

      - name: Unit tests (pure crates, no Postgres)
        run: make test-extension

      - name: pgrx integration tests
        run: make pg-test

  # Java: the worker reactor. Its POM pulls in the connectors submodule modules,
  # and zonky embedded Postgres provisions its own binary at test time, so no
  # service container is needed.
  java-worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify
        working-directory: worker
        run: mvn -B verify
