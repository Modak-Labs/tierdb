site_name: tierdb
site_description: >-
  Fast, transparent and cost-effective data tiering between Postgres and
  Apache Iceberg.
site_url: https://modak-labs.github.io/tierdb/
repo_url: https://github.com/Modak-Labs/tierdb
repo_name: tierdb

docs_dir: pages
site_dir: ../site

theme:
  name: material
  custom_dir: overrides
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

extra_css:
  - assets/css/extra.css

extra_javascript:
  - assets/js/nav.js
  - assets/js/mascots.js
  - assets/js/hot-cold.js

extra:
  generator: false

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: false
  - pymdownx.inlinehilite
  - pymdownx.details

nav:
  - Home: index.md
  - Getting started:
      - Quickstart: getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Concepts: getting-started/concepts.md
      - Architecture: getting-started/architecture.md
  - Modes:
      - Choosing a mode: modes/choosing.md
      - The contract: modes/contract.md
  - Working with tables:
      - Registering tables: tables/registering-tables.md
      - Storage profiles: tables/storage-profiles.md
      - Reading: tables/reading.md
      - Corrections & schema changes: tables/corrections.md
  - Ingestion:
      - Bulk ingestion: ingestion/bulk-ingestion.md
      - Stream load: ingestion/stream-load.md
  - Integrations:
      - Overview: integrations/index.md
      - Spark: integrations/spark.md
      - Trino: integrations/trino.md
  - Operations:
      - Deployment modes: operations/deployment.md
      - Production deployment: operations/production.md
      - Deploying on AWS: operations/aws.md
      - Day-2 operations: operations/day-2.md
      - Lake maintenance: operations/lake-maintenance.md
      - Console: operations/console.md
  - Reference:
      - SQL API: reference/sql.md
      - CLI: reference/cli.md
      - Configuration: reference/configuration.md
      - Catalog schema: reference/catalog.md
      - Seam protocol: reference/seam.md
      - Metrics: reference/metrics.md
